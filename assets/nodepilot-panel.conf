# 3x-ui v3.9.0 internal/web/controller/index.go and internal/logger/logger.go.
# Go %q escapes attacker-supplied usernames: never search an unanchored IP field.
[Definition]
failregex = ^\s*WARNING - failed login: username="(?:[^"\\\r\n]|\\.)*", IP="<HOST>", reason="(?:invalid credentials|invalid 2FA code|too many failed attempts)"(?:, blocked_until=\S+)?\s*$
ignoreregex =
datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
